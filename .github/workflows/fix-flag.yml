name: Restore simple Saudi flag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Restore simple Saudi flag') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore simple flag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.saudi-flag{width:31px;height:21px;background:#006c35;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.18);overflow:hidden}.saudi-flag:before{content:"لا إله إلا الله";color:#fff;font-size:5px;font-weight:700;white-space:nowrap;transform:scaleX(.9)}.saudi-flag:after{content:"";position:absolute;left:7px;right:7px;bottom:4px;height:1.5px;background:#fff;border-radius:2px}'
          new = '.saudi-flag{width:auto;height:auto;background:none;border-radius:0;display:inline-flex;align-items:center;justify-content:center;position:relative;box-shadow:none;overflow:visible;font-size:18px;line-height:1}.saudi-flag:before{content:"🇸🇦";color:inherit;font-size:inherit;font-weight:400;white-space:nowrap;transform:none}.saudi-flag:after{content:none}'
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-flag.yml
          git add index.html .github/workflows/fix-flag.yml
          git commit -m 'Restore simple Saudi flag' || exit 0
          git push