<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كارد | Kard</title>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root[data-theme="light"] {
            --bg-main: #f4f6f9;
            --surface-card: #ffffff;
            --border-color: #e5e7eb;
            --accent-green: #10b981;
            --text-main: #111827;
            --text-sub: #6b7280;
            --input-bg: #f9fafb;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --btn-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.06);
            --btn-shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        :root[data-theme="dark"] {
            --bg-main: #0b0f17;
            --surface-card: #151c28;
            --border-color: #232d3f;
            --accent-green: #10b981;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --input-bg: #0b0f17;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            --btn-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.3);
            --btn-shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Readex Pro', sans-serif; transition: background-color 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 8%;
            border-bottom: 1px solid var(--border-color);
            background: var(--surface-card);
            position: sticky; top: 0; z-index: 100;
        }

        .logo-container { display: flex; align-items: center; gap: 0.8rem; }
        .logo-icon {
            width: 40px; height: 40px; background: var(--accent-green);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #fff; font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .logo-text { font-size: 1.4rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }

        .header-actions { display: flex; align-items: center; gap: 0.6rem; }

        .icon-btn-transparent {
            background: transparent; border: none;
            color: var(--text-main); width: 40px; height: 40px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .icon-btn-transparent:hover { background: var(--input-bg); }
        .icon-btn-transparent svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .lang-text-btn {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-main); padding: 0.4rem 0.9rem; border-radius: 12px;
            cursor: pointer; font-size: 0.85rem; font-weight: 500;
        }
        .lang-text-btn:hover { border-color: var(--accent-green); }

        .tabs-wrapper { display: flex; justify-content: center; margin: 2rem 0 1.5rem; }
        .tabs-box {
            display: flex; gap: 12px;
        }

        .tab-card {
            background: var(--surface-card); border: 1px solid var(--border-color);
            padding: 0.8rem 1.6rem; border-radius: 16px; cursor: pointer;
            font-weight: 500; font-size: 0.9rem; color: var(--text-sub);
            box-shadow: var(--btn-shadow); transition: all 0.25s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .tab-card:hover {
            transform: translateY(-2px); box-shadow: var(--btn-shadow-hover);
        }
        .tab-card.active {
            background: var(--surface-card);
            border-color: var(--accent-green);
            color: var(--accent-green);
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
        }

        .main-container {
            max-width: 1100px; margin: 0 auto 4rem; padding: 0 1.5rem;
            display: grid; grid-template-columns: 380px 1fr; gap: 2rem;
        }
        @media (max-width: 850px) { .main-container { grid-template-columns: 1fr; } }

        .panel-box {
            background: var(--surface-card); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 1.8rem; box-shadow: var(--card-shadow);
        }
        .panel-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 1.4rem; color: var(--text-main); }

        .field-group { margin-bottom: 1rem; }
        .field-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.4rem; font-weight: 500; }
        .field-group input, .field-group textarea, .field-group select {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 0.75rem 0.9rem; color: var(--text-main); font-size: 0.85rem;
        }
        .field-group input:focus, .field-group textarea:focus, .field-group select:focus {
            outline: none; border-color: var(--accent-green);
        }

        .btn-card-primary {
            width: 100%; background: var(--surface-card);
            color: var(--text-main); border: 1px solid var(--border-color);
            padding: 0.9rem; border-radius: 16px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            margin-top: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: var(--btn-shadow); transition: all 0.25s ease;
        }
        .btn-card-primary:hover {
            transform: translateY(-2px); border-color: var(--accent-green); color: var(--accent-green); box-shadow: var(--btn-shadow-hover);
        }

        .preview-wrapper {
            background: var(--surface-card); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 2rem; box-shadow: var(--card-shadow);
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 450px;
        }

        /* GIFT CARD MINIMALIST */
        .card-frame {
            width: 100%; max-width: 400px; min-height: 250px;
            background: #ffffff; color: #0f172a;
            border-radius: 18px; padding: 1.8rem; position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            display: flex; flex-direction: column; justify-content: space-between;
            border: 1px solid #e5e7eb;
        }

        .card-header { text-align: center; border-bottom: 1px solid #f3f4f6; padding-bottom: 0.8rem; }
        .card-store { font-size: 1.05rem; font-weight: 700; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; }

        .card-body { text-align: center; margin: 1.2rem 0; }
        .card-text { font-size: 0.95rem; line-height: 1.6; color: #374151; font-weight: 400; }

        .card-footer { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid #f3f4f6; padding-top: 0.8rem; }
        .card-parties { font-size: 0.8rem; color: #6b7280; line-height: 1.5; text-align: right; }
        .card-parties strong { color: #111827; font-weight: 600; }
        
        .qr-canvas-box { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .qr-canvas-box canvas { width: 50px !important; height: 50px !important; border-radius: 6px; display: block; }

        #posterCanvas { max-width: 100%; height: auto; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">ك</div>
            <div class="logo-text">كارد</div>
        </div>
        <div class="header-actions">
            <button class="icon-btn-transparent" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle Theme">
                <!-- Moon SVG Default -->
                <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
            <button class="lang-text-btn" onclick="toggleLanguage()" id="langBtn">English</button>
        </div>
    </header>

    <div class="tabs-wrapper">
        <div class="tabs-box">
            <button class="tab-card active" onclick="switchTab('gift')" id="tabGift">
                <span id="txtTabGift">بطاقات الإهداء</span>
            </button>
            <button class="tab-card" onclick="switchTab('poster')" id="tabPoster">
                <span id="txtTabPoster">بوسترات العروض</span>
            </button>
        </div>
    </div>

    <div class="main-container">
        
        <div class="panel-box">
            <!-- Gift Controls -->
            <div id="giftControls">
                <div class="panel-title" id="txtGiftTitle">تخصيص بطاقة الإهداء</div>
                <div class="field-group">
                    <label id="lblStore">اسم المتجر</label>
                    <input type="text" id="storeName" value="متجر الفخامة" oninput="updateCard()">
                </div>
                <div class="field-group">
                    <label id="lblStoreUrl">رابط المتجر (تحويل لـ QR Code)</label>
                    <input type="text" id="storeUrl" value="https://salla.sa/my-store" oninput="updateCard()">
                </div>
                <div class="field-group">
                    <label id="lblSender">اسم المرسل</label>
                    <input type="text" id="senderName" value="عبدالله السلمان" oninput="updateCard()">
                </div>
                <div class="field-group">
                    <label id="lblReceiver">اسم المستلم</label>
                    <input type="text" id="receiverName" value="فيصل الخالد" oninput="updateCard()">
                </div>
                <div class="field-group">
                    <label id="lblMsg">عبارة الإهداء</label>
                    <textarea id="cardMsg" rows="3" oninput="updateCard()">كل عام وأنت بألف خير، أتمنى لك أياماً مليئة بالسعادة والنجاح.</textarea>
                </div>
                <button class="btn-card-primary" onclick="downloadCardImage()" id="btnPrint">
                    <span id="txtBtnPrint">تحميل البطاقة (صورة عالية الدقة)</span>
                </button>
            </div>

            <!-- Poster Controls -->
            <div id="posterControls" style="display: none;">
                <div class="panel-title" id="txtPosterTitle">تخصيص البوستر الإعلاني</div>
                <div class="field-group">
                    <label id="lblPlatform">قياس المنصة</label>
                    <select id="pPlatform" onchange="drawPoster()">
                        <option value="square">منشور مربع (1:1)</option>
                        <option value="story">قصة / ستوري (9:16)</option>
                    </select>
                </div>
                <div class="field-group">
                    <label id="lblImage">صورة المنتج أو الخلفية</label>
                    <input type="file" id="pImgInput" accept="image/*" onchange="loadPosterImage(event)">
                </div>
                <div class="field-group">
                    <label id="lblPStore">اسم المتجر</label>
                    <input type="text" id="pStore" value="متجر الفخامة" oninput="drawPoster()">
                </div>
                <div class="field-group">
                    <label id="lblPProduct">اسم المنتج / العرض</label>
                    <input type="text" id="pProduct" value="عطر السمو الملكي" oninput="drawPoster()">
                </div>
                <div class="field-group">
                    <label id="lblPPrice">السعر</label>
                    <input type="text" id="pPrice" value="299 ر.س (بدلاً من 450 ر.س)" oninput="drawPoster()">
                </div>
                <div class="field-group">
                    <label id="lblPOffer">عبارة التخفيض</label>
                    <input type="text" id="pOffer" value="خصم حصري 35% لفترة محدودة" oninput="drawPoster()">
                </div>
                <div class="field-group">
                    <label id="lblPUrl">رابط صفحة العرض (تحويل لـ QR Code)</label>
                    <input type="text" id="pUrl" value="https://salla.sa/my-store/product-1" oninput="drawPoster()">
                </div>
                <button class="btn-card-primary" onclick="downloadPoster()" id="btnDownload">
                    <span id="txtBtnDownload">تحميل البوستر (صورة عالية الدقة)</span>
                </button>
            </div>
        </div>

        <div class="preview-wrapper">
            <!-- Gift Preview Screen -->
            <div id="giftDisplay" style="width: 100%; display: flex; justify-content: center;">
                <div class="card-frame" id="cardToCapture">
                    <div class="card-header">
                        <div class="card-store" id="prevStore">متجر الفخامة</div>
                    </div>
                    <div class="card-body">
                        <div class="card-text" id="prevMsg">"كل عام وأنت بألف خير، أتمنى لك أياماً مليئة بالسعادة والنجاح."</div>
                    </div>
                    <div class="card-footer">
                        <div class="card-parties">
                            <div><span id="lblFrom">من:</span> <strong id="prevSender">عبدالله السلمان</strong></div>
                            <div><span id="lblTo">إلى:</span> <strong id="prevReceiver">فيصل الخالد</strong></div>
                        </div>
                        <div class="qr-canvas-box">
                            <canvas id="cardQrCanvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Poster Preview Screen -->
            <div id="posterDisplay" style="display: none;">
                <canvas id="posterCanvas" width="500" height="500"></canvas>
            </div>
        </div>

    </div>

    <canvas id="posterQrCanvas" style="display: none;"></canvas>

    <script>
        let currentLang = 'ar';
        let uploadedImage = null;

        const moonSvg = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        const sunSvg = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').innerHTML = newTheme === 'light' ? moonSvg : sunSvg;
        }

        function renderQR(canvasId, text, size) {
            try {
                let el = document.getElementById(canvasId);
                if (el) {
                    new QRious({
                        element: el,
                        value: text || 'https://salla.sa',
                        size: size || 150,
                        level: 'H'
                    });
                }
            } catch(e) { console.error("QR Error", e); }
        }

        window.onload = function() {
            updateCard();
        };

        function switchTab(tab) {
            if(tab === 'gift') {
                document.getElementById('tabGift').classList.add('active');
                document.getElementById('tabPoster').classList.remove('active');
                document.getElementById('giftControls').style.display = 'block';
                document.getElementById('posterControls').style.display = 'none';
                document.getElementById('giftDisplay').style.display = 'flex';
                document.getElementById('posterDisplay').style.display = 'none';
            } else {
                document.getElementById('tabPoster').classList.add('active');
                document.getElementById('tabGift').classList.remove('active');
                document.getElementById('posterControls').style.display = 'block';
                document.getElementById('giftControls').style.display = 'none';
                document.getElementById('posterDisplay').style.display = 'block';
                document.getElementById('giftDisplay').style.display = 'none';
                drawPoster();
            }
        }

        function updateCard() {
            const store = document.getElementById('storeName').value;
            const sender = document.getElementById('senderName').value;
            const receiver = document.getElementById('receiverName').value;
            const msg = '"' + document.getElementById('cardMsg').value + '"';
            const url = document.getElementById('storeUrl').value;

            document.getElementById('prevStore').innerText = store;
            document.getElementById('prevSender').innerText = sender;
            document.getElementById('prevReceiver').innerText = receiver;
            document.getElementById('prevMsg').innerText = msg;
            renderQR('cardQrCanvas', url, 150);
        }

        function downloadCardImage() {
            updateCard();
            const target = document.getElementById('cardToCapture');
            html2canvas(target, {
                scale: 3,
                backgroundColor: '#ffffff',
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'kard-gift.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function loadPosterImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                uploadedImage = new Image();
                uploadedImage.onload = function() { drawPoster(); }
                uploadedImage.src = reader.result;
            }
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        function drawPoster() {
            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');
            const platform = document.getElementById('pPlatform').value;
            const pUrl = document.getElementById('pUrl').value;

            if (platform === 'story') {
                canvas.width = 1080;
                canvas.height = 1920;
            } else {
                canvas.width = 1080;
                canvas.height = 1080;
            }

            if (uploadedImage) {
                ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 8;
            ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

            ctx.fillStyle = '#10b981';
            ctx.font = 'bold 40px Readex Pro';
            ctx.textAlign = 'center';
            ctx.fillText(document.getElementById('pStore').value, canvas.width / 2, 120);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(120, 160, canvas.width - 240, 75);
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 32px Readex Pro';
            ctx.fillText(document.getElementById('pOffer').value, canvas.width / 2, 210);

            let midY = canvas.height / 2 - 20;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px Readex Pro';
            ctx.fillText(document.getElementById('pProduct').value, canvas.width / 2, midY);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '38px Readex Pro';
            ctx.fillText(document.getElementById('pPrice').value, canvas.width / 2, midY + 80);

            renderQR('posterQrCanvas', pUrl, 200);
            const posterQrCanvas = document.getElementById('posterQrCanvas');

            const qrSize = 140;
            const qrX = (canvas.width - qrSize) / 2;
            const qrY = canvas.height - 250;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(qrX - 10, qrY - 10, qrSize + 20, qrSize + 20);
            ctx.drawImage(posterQrCanvas, qrX, qrY, qrSize, qrSize);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '26px Readex Pro';
            ctx.fillText('امسح الرمز للطلب المباشر', canvas.width / 2, canvas.height - 70);
        }

        function downloadPoster() {
            const canvas = document.getElementById('posterCanvas');
            const link = document.createElement('a');
            link.download = 'kard-poster.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function toggleLanguage() {
            if (currentLang === 'ar') {
                currentLang = 'en';
                document.documentElement.setAttribute('dir', 'ltr');
                document.getElementById('langBtn').innerText = 'العربية';
                
                document.getElementById('txtTabGift').innerText = 'Gift Cards';
                document.getElementById('txtTabPoster').innerText = 'Promo Posters';
                document.getElementById('txtGiftTitle').innerText = 'Gift Card Customization';
                document.getElementById('lblStore').innerText = 'Store Name';
                document.getElementById('lblStoreUrl').innerText = 'Store URL (Links to QR)';
                document.getElementById('lblSender').innerText = 'Sender Name';
                document.getElementById('lblReceiver').innerText = 'Receiver Name';
                document.getElementById('lblMsg').innerText = 'Gift Message';
                document.getElementById('txtBtnPrint').innerText = 'Download Card (HD Image)';
                
                document.getElementById('txtPosterTitle').innerText = 'Poster Customization';
                document.getElementById('lblPlatform').innerText = 'Platform Aspect Ratio';
                document.getElementById('lblImage').innerText = 'Product / Background Image';
                document.getElementById('lblPStore').innerText = 'Store Name';
                document.getElementById('lblPProduct').innerText = 'Product Name';
                document.getElementById('lblPPrice').innerText = 'Price';
                document.getElementById('lblPOffer').innerText = 'Discount Tagline';
                document.getElementById('lblPUrl').innerText = 'Offer Link (Converts to QR)';
                document.getElementById('txtBtnDownload').innerText = 'Download Poster (HD Image)';
                document.getElementById('lblFrom').innerText = 'From:';
                document.getElementById('lblTo').innerText = 'To:';
            } else {
                currentLang = 'ar';
                document.documentElement.setAttribute('dir', 'rtl');
                document.getElementById('langBtn').innerText = 'English';
                
                document.getElementById('txtTabGift').innerText = 'بطاقات الإهداء';
                document.getElementById('txtTabPoster').innerText = 'بوسترات العروض';
                document.getElementById('txtGiftTitle').innerText = 'تخصيص بطاقة الإهداء';
                document.getElementById('lblStore').innerText = 'اسم المتجر';
                document.getElementById('lblStoreUrl').innerText = 'رابط المتجر (تحويل لـ QR Code)';
                document.getElementById('lblSender').innerText = 'اسم المرسل';
                document.getElementById('lblReceiver').innerText = 'اسم المستلم';
                document.getElementById('lblMsg').innerText = 'عبارة الإهداء';
                document.getElementById('txtBtnPrint').innerText = 'تحميل البطاقة (صورة عالية الدقة)';
                
                document.getElementById('txtPosterTitle').innerText = 'تخصيص البوستر الإعلاني';
                document.getElementById('lblPlatform').innerText = 'قياس المنصة';
                document.getElementById('lblImage').innerText = 'صورة المنتج أو الخلفية';
                document.getElementById('lblPStore').innerText = 'اسم المتجر';
                document.getElementById('lblPProduct').innerText = 'اسم المنتج / العرض';
                document.getElementById('lblPPrice').innerText = 'السعر';
                document.getElementById('lblPOffer').innerText = 'عبارة التخفيض';
                document.getElementById('lblPUrl').innerText = 'رابط صفحة العرض (تحويل لـ QR Code)';
                document.getElementById('txtBtnDownload').innerText = 'تحميل البوستر (صورة عالية الدقة)';
                document.getElementById('lblFrom').innerText = 'من:';
                document.getElementById('lblTo').innerText = 'إلى:';
            }
        }
    </script>
</body>
</html>
