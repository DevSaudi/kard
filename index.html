ng:13px 18px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:linear-gradient(135deg,#00343a,#00894a);color:#fff;border-color:transparent}.workspace{display:grid;grid-template-columns:330px minmax(0,1fr) 285px;gap:14px;margin:14px 0 45px}.panel,.preview,.side-panel{background:#fff;border:1px solid #dce8e4;box-shadow:0 18px 55px #00343a18}.panel{padding:20px}.field{margin-bottom:12px}.field label{display:block;color:#657775;font-size:10px;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid #dce8e4;border-radius:9px;background:#f7faf9;color:#07383b}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:linear-gradient(135deg,#00343a,#00894a);color:#fff;font-weight:700}.preview{min-height:600px;display:flex;align-items:center;justify-content:center;padding:26px}.art{width:min(100%,470px);box-shadow:0 28px 65px #00343a38}.national-art{aspect-ratio:1;background:#00343a;color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.national-art:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#5aba1c29 1px,transparent 1px),linear-gradient(90deg,#5aba1c29 1px,transparent 1px);background-size:25px 25px}.n-top,.n-main,.n-bottom{position:relative;z-index:2}.n-top{display:flex;justify-content:space-between}.n-main{text-align:center}.n-main h3{font-size:65px;margin:8px 0}.n-slogan{font-size:21px;font-weight:700;color:#5aba1c}.n-offer{margin:18px auto;background:#fff;color:#00343a;padding:12px 25px;font-weight:700}.qr{background:#fff;padding:5px}.qr canvas{width:60px!important;height:60px!important}.hidden{display:none!important}@media(max-width:900px){.banner-content,.workspace{grid-template-columns:1fr}.banner-art{display:none}.workspace{display:flex;flex-direction:column}.panel,.preview,.side-panel{width:100%;box-sizing:border-box}.preview{min-height:500px}}</style></head>
